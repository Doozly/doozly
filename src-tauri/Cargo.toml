[package]
name = "doozly"
version = "0.1.0"
description = "Your tasks, in your own cloud."
license = "AGPL-3.0-or-later"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "doozly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
notify-rust = "4.19.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-window-state = "2.5.0"
# Desktop sign-in (src/auth.rs)
base64 = "0.22"
getrandom = "0.3"
# Same TLS as the updater: rustls with ring, no second crypto library
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "form"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "rt"] }
url = "2"

[features]
# The CI self-test, see src/smoke.rs. Never in a release.
smoke = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["async-secret-service", "tokio", "crypto-rust"] }
zbus = { version = "6.4.0", default-features = false, features = ["proxy"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-updater = "2.12.0"
