name: CI

# Only for a release tag on main or by hand, to save the minutes
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"

jobs:
  # A tag can sit on any branch, the trigger doesnt know. Same for a run by hand.
  on-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
  check:
    needs: on-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec biome ci
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size

  e2e:
    needs: on-main
    runs-on: ubuntu-latest
    # Like a dev's .env.local, so the account button is there. Not the relay, tests mustn't reach the real one.
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      VITE_MICROSOFT_CLIENT_ID: ${{ vars.VITE_MICROSOFT_CLIENT_ID }}
      VITE_DROPBOX_CLIENT_ID: ${{ vars.VITE_DROPBOX_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  relay:
    needs: on-main
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: shellcheck deploy/*.sh ../scripts/*.sh
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  desktop:
    needs: on-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri
      # Tauri embeds the frontend at compile time, but the lints don't need a real one
      - run: mkdir -p dist
      - working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - working-directory: src-tauri
        run: cargo test

  # The app's own self-test (src-tauri/src/smoke.rs) in each system's real webview. No WebDriver
  # needed, so it covers WebView2 and WKWebView too. The exit code is the result.
  desktop-smoke:
    needs: on-main
    strategy:
      fail-fast: false
      matrix:
        # Intel, the Apple silicon runners are often too busy to start (WKWebView is the same)
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev xvfb
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri
          key: smoke
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --debug --no-bundle --features smoke
      - if: runner.os == 'Linux'
        run: |
          # WebKitGTK's sandbox needs user namespaces, which Ubuntu's AppArmor holds back on runners
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          dbus-run-session -- xvfb-run --auto-servernum src-tauri/target/debug/doozly
      - if: runner.os == 'macOS'
        run: src-tauri/target/debug/doozly
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process src-tauri\target\debug\doozly.exe -NoNewWindow -Wait -PassThru
          exit $p.ExitCode

  # The SPA in the real WebKitGTK webview. Windows' msedgedriver doesn't get a session with
  # WebView2 yet (DevToolsActivePort), and macOS has no WebDriver for WKWebView at all.
  desktop-e2e:
    needs: on-main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev webkitgtk-webdriver xvfb
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri
      - run: cargo install tauri-driver --version 2.1.0 --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --debug --no-bundle
      # WebKitGTK's sandbox needs user namespaces, which Ubuntu's AppArmor holds back on runners
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: dbus-run-session -- xvfb-run --auto-servernum node --test --test-timeout=120000 "e2e-desktop/*.test.ts"
