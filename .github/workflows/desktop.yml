name: Desktop

# Installers for all three systems. macOS minutes are expensive, so only for a tag on main or by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}

env:
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"
  VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
  VITE_MICROSOFT_CLIENT_ID: ${{ vars.VITE_MICROSOFT_CLIENT_ID }}
  VITE_DROPBOX_CLIENT_ID: ${{ vars.VITE_DROPBOX_CLIENT_ID }}
  VITE_RELAY_URL: ${{ vars.VITE_RELAY_URL }}
  # Desktop sign-in, only the Rust build reads these (src-tauri/build.rs)
  GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.GOOGLE_DESKTOP_CLIENT_ID }}
  GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}

jobs:
  # A tag can sit on any branch, the trigger doesnt know. A release from there would go out to everyone.
  on-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build:
    needs: on-main
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the deb and AppImage run on older glibc too
          - os: ubuntu-22.04
            args: ""
          # Both Macs build on Intel runners: the Apple silicon ones often get no runner for
          # long enough that GitHub cancels the job. Xcode cross-builds for Apple silicon fine.
          - os: macos-15-intel
            args: --target aarch64-apple-darwin
          - os: macos-15-intel
            args: --target x86_64-apple-darwin
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri
          key: ${{ matrix.args }}
      - run: pnpm install --frozen-lockfile
      # The release notes, also what the update offer in the app shows
      - name: Notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          test "$(node -p 'require("./package.json").version')" = "$version" || {
            echo "The tag says $version but package.json doesn't, use scripts/release.sh"; exit 1; }
          awk -v v="## $version " 'index($0, v) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no notes for $version"; exit 1; }
          { echo 'notes<<EOF'; cat notes.md; echo EOF; } >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles, so an app only takes updates that came from us
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          # A tag makes a draft release to check before it goes out, a manual run only artifacts
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Doozly ${{ github.ref_name }}
          releaseBody: ${{ env.notes }}
          releaseDraft: true
          uploadUpdaterJson: true
          uploadWorkflowArtifacts: true
      # For MDM tools (Jamf, Kandji, Munki), which install a pkg without asking. Unsigned like the rest.
      - name: A pkg for managed Macs
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "${{ matrix.args }}" in
            *aarch64*) target=aarch64-apple-darwin arch=aarch64 ;;
            *) target=x86_64-apple-darwin arch=x64 ;;
          esac
          version=${GITHUB_REF_NAME#v}
          pkg="Doozly_${version}_${arch}.pkg"
          mkdir -p root/Applications
          cp -R "src-tauri/target/$target/release/bundle/macos/Doozly.app" root/Applications/
          # Else the installer may "update" a copy of the app somewhere else instead of /Applications
          pkgbuild --analyze --root root components.plist
          plutil -replace 0.BundleIsRelocatable -bool NO components.plist
          pkgbuild --root root --component-plist components.plist --identifier app.doozly.desktop \
            --version "$version" --install-location / "$pkg"
          gh release upload "$GITHUB_REF_NAME" "$pkg" --clobber
